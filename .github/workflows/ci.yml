name: Correctness
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: correctness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --testTimeout=15000
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser correctness (software GPU; not a performance benchmark)
        run: npm run test:browser -- tests/browser/ci-smoke.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results
