name: Correctness
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: correctness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --testTimeout=15000
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Install software Vulkan driver
        run: sudo apt-get install -y mesa-vulkan-drivers vulkan-tools xvfb
      - name: Browser correctness (software GPU; not a performance benchmark)
        run: |
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_DRIVER_FILES"
          xvfb-run -a vulkaninfo --summary
          xvfb-run -a npm run test:browser -- tests/browser/ci-smoke.spec.mjs tests/browser/prepared-assets.spec.mjs tests/browser/webgpu.spec.mjs tests/browser/canopy-lighting.spec.mjs tests/browser/temporal-reset.spec.mjs tests/browser/water-staging.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results
