<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Terrain Runtime Example</title>
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 0;
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100dvh;
        background: #16211b;
        color: #d4e0cd;
        font: 13px system-ui;
      }
      header {
        min-height: 58px;
        flex-wrap: wrap;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 20px;
        border-bottom: 1px solid #3c5036;
      }
      h1 {
        font-size: 15px;
        margin: 0 18px 0 0;
      }
      button,
      select,
      label {
        font: inherit;
        color: inherit;
        background: #2b3b27;
        border: 1px solid #526449;
        border-radius: 5px;
        padding: 8px 11px;
        cursor: pointer;
      }
      input {
        display: none;
      }
      #stage {
        position: relative;
        min-height: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      footer {
        min-height: 31px;
        flex-wrap: wrap;
        display: flex;
        align-items: center;
        padding: 0 20px;
        gap: 20px;
        background: #17201a;
      }
      #status {
        flex: 1;
      }
      a {
        color: #bad29d;
      }
      @media (max-width: 900px) {
        header {
          gap: 5px;
          padding: 0 8px;
        }
        h1 {
          font-size: 12px;
        }
        button,
        select,
        label {
          font-size: 10px;
          padding: 8px 5px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Terrain Runtime</h1>
      <select id="sample" aria-label="Sample scene">
        <option value="upland">Upland meadow · generated assets</option>
        <option value="detailed">Detailed terrain</option>
        <option value="stylized">Low-poly islands</option>
        <option value="simulation">Collision sample</option></select
      ><label
        >Open terrain / JSON / GLB<input
          id="open-project"
          type="file"
          accept=".json,.terrain,.glb" /></label
      ><select id="reference-view" aria-label="Reference viewpoint" hidden>
        <option value="trail">Trail view</option>
        <option value="overview">Overview</option>
        <option value="grass">Grass detail</option></select
      ><a
        id="reference-download"
        href="./examples/upland/upland-meadow.terrain"
        download
        hidden
        >Download editable scene</a
      ><button id="wind">Wind on</button
      ><button id="contact">Contact pulse</button
      ><button id="physics">Enable physics</button
      ><button id="drop">Drop body</button><a href="/">Editor</a>
    </header>
    <main id="stage"></main>
    <footer>
      <span id="reference-note" hidden
        >Generated color textures ·
        <a href="./examples/upland/README.md">Asset notes</a></span
      ><span id="status">Loading runtime…</span><span id="lighting"></span
      ><span id="contacts">0 ground contacts</span
      ><span id="foliage-rendering"></span>
    </footer>
    <script type="module" src="/examples/runtime.mjs"></script>
  </body>
</html>
