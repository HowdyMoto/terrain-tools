<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Terrain Studio · Streamed world</title>
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 0;
        background: #17231e;
        color: #eff5ed;
        font: 14px system-ui;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      header {
        position: fixed;
        top: 16px;
        left: 16px;
        padding: 16px;
        background: #122319dd;
        border: 1px solid #668367;
        border-radius: 8px;
        max-width: 430px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 10px;
      }
      button {
        font: inherit;
        background: #36533a;
        color: inherit;
        border: 1px solid #77917b;
        padding: 7px 12px;
        border-radius: 4px;
        cursor: pointer;
      }
      p {
        margin: 10px 0 0;
        font-size: 12px;
        line-height: 1.5;
      }
      a {
        color: #b3debd;
      }
      #status {
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Streamed world · 2 × 2 km</h1>
      <button data-view="forest">Forest</button>
      <button data-view="open">Open ground</button>
      <button data-view="coast">Coast</button>
      <p>
        Drag to look · wheel to explore. Terrain detail adapts to distance; tile
        collision keeps full detail.
      </p>
      <p id="status">Preparing shared assets…</p>
      <p>
        Pine and fern: Rico Cilliers &amp; Rob Tuytel,
        <a href="https://polyhaven.com">Poly Haven</a> (CC0). Ground: generated
        Upland reference textures.
      </p>
    </header>
    <script type="module" src="/src/examples/world.ts"></script>
  </body>
</html>
